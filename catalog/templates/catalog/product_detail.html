{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>{{ product.name }}</h1>

    <p><strong>Описание:</strong> {{ product.description }}</p>
    <p><strong>Цена:</strong> {{ product.price }}</p>

    {% if product.image %}
        <img src="{{ product.image.url }}" width="300">
    {% endif %}

    <br><br>
    <a href="{% url 'catalog:home' %}">Назад на главную</a>
</div>
{% endblock %}
